spring.application.name=management-service
server.port=9192 

# K?t n?i Eureka server
eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Th�m discovery client n?u c?n
spring.cloud.discovery.enabled=true

# DB connection n?u c� (t�y)
spring.datasource.url=jdbc:mysql://localhost:3306/AppClass
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Encoding
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

api.prefix=/api/management

# activate Actuator endpoints
management.endpoints.web.exposure.include=health,info

# optional access without auth
management.endpoint.health.show-details=always
