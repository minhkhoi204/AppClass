spring.application.name=user-service

server.port=9191

# JDBC URL conntect to PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5432/AppClass
spring.datasource.url=jdbc:mysql://localhost:3306/AppClass


# Username and password of PostgreSQL
spring.datasource.username=root
spring.datasource.password=root

# Driver class name (PostgreSQL)
# spring.datasource.driver-class-name=org.postgresql.Driver

# MySql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

# JPA (Hibernate) configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Encoding (xu ly tot voi tieng viet)
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

api.prefix=/api/v1