server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        # User Service Routes
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/auth/**
          filters:
            - StripPrefix=0
        
        # Student Routes (user-service)
        - id: student-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/students/**
          filters:
            - StripPrefix=0
        
        # Catechist Routes (user-service)
        - id: catechist-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/catechists/**
          filters:
            - StripPrefix=0
        
        # Management Service Routes
        - id: management-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/classrooms/**, /api/enrollments/**, /api/attendance/**
          filters:
            - StripPrefix=0
      
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
