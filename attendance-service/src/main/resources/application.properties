spring.application.name=attendance-service

server.port=8083

academic.service.url=http://localhost:8082


# JDBC URL connect to MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/AppClass_Attendance
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

api.prefix=/api
